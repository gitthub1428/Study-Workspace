
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=5.0,
user-scalable=yes">

<title>Drive Workspace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg-base:#050505;
    --glass-bg:rgba(20,20,24,.65);
    --glass-border:rgba(255,255,255,.08);
    --glass-shadow:0 8px 32px rgba(0,0,0,.5);

    --text-main:#e2e2e6;
    --text-muted:#8b8b98;

    --btn-bg:rgba(255,255,255,.10);
    --btn-hover:rgba(255,255,255,.18);

    --accent-active:#fff;
    --accent-text:#000;

    --radius-large:24px;
    --radius-pill:50px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;

    background:#050505;

    background-image:
    radial-gradient(circle at 15% 50%, rgba(70,50,120,.15), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(50,90,120,.15), transparent 40%);

    color:var(--text-main);

    overflow:hidden;

    height:100dvh;
}

body.white-theme{
    --glass-bg:rgba(255,255,255,.78);
    --glass-border:rgba(15,23,42,.14);
    --glass-shadow:0 8px 32px rgba(15,23,42,.16);
    --text-main:#172033;
    --text-muted:#526075;
    --btn-bg:rgba(15,23,42,.08);
    --btn-hover:rgba(15,23,42,.14);
    background:#eef2f7;
    color:var(--text-main);
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:var(--btn-hover);
    border-radius:10px;
}

.glass-panel{
    background:var(--glass-bg);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid var(--glass-border);

    box-shadow:var(--glass-shadow);
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;

    top:12px;
    left:12px;
    right:12px;

    height:58px;

    border-radius:var(--radius-pill);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    z-index:1000;

    overflow:hidden;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;

    gap:6px;

    min-width:0;
}

.header-right{
    margin-left:auto;
}

.sync-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#4ade80;

    box-shadow:0 0 10px #4ade80;

    opacity:0;

    flex-shrink:0;
}

.sync-dot.active{
    opacity:1;
}

button{
    flex-shrink:0;

    min-width:40px;
    width:40px;
    height:40px;

    padding:0;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.12);

    border-radius:var(--radius-pill);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.25s ease;

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 4px 12px rgba(0,0,0,.35);
}

button:hover{
    background:rgba(255,255,255,.24);

    border-color:rgba(255,255,255,.2);

    box-shadow:
    0 0 18px rgba(255,255,255,.08),
    0 6px 16px rgba(0,0,0,.4);
}

button:focus-visible,
.item-row:focus-visible,
.modal-folder:focus-visible,
#upload-dropzone:focus-visible{
    outline:2px solid #60a5fa;
    outline-offset:2px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

button svg{
    width:18px;
    height:18px;
}

#upload-btn{
    background:rgba(255, 255, 255, 0.28);
}

#download-btn{
    background:rgba(255, 255, 255, 0.28);

    display:none;
}

#refresh-btn.loading svg{
    animation:spin 1s linear infinite;
}

.zoom-controls{
    display:flex;
    align-items:center;

    background:var(--btn-bg);

    border-radius:var(--radius-pill);

    padding:2px;

    flex-shrink:1;
}

.zoom-controls button{
    min-width:34px;
    width:34px;
    height:34px;

    background:none;
}

#zoom-display{
    min-width:38px;

    text-align:center;

    font-size:11px;

    color:var(--text-muted);
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
    position:fixed;

    top:84px;
    left:-320px;

    width:280px;

    height:calc(100dvh - 96px);

    border-radius:var(--radius-large);

    overflow:hidden;

    display:flex;
    flex-direction:column;

    transition:left .35s;

    z-index:999;
}

#sidebar.open{
    left:12px;
}

#sidebar.closed{
    left:-320px;
}

body.sidebar-closed main{
    left:12px;
}

.sidebar-toggle{
    position:relative;
    width:42px;
    height:24px;
    min-width:42px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

.sidebar-toggle::after{
    content:'';
    position:absolute;
    top:4px;
    left:4px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#fff;
    transition:transform .2s ease;
}

.sidebar-toggle[aria-pressed="true"]::after{
    transform:translateX(18px);
}

.theme-toggle{
    position:relative;
    width:42px;
    height:24px;
    min-width:42px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

.theme-toggle::after{
    content:'☾';
    position:absolute;
    top:3px;
    left:4px;
    width:18px;
    height:18px;
    line-height:18px;
    border-radius:50%;
    color:#000;
    background:#fff;
    font-size:12px;
    transition:transform .2s ease;
}

.theme-toggle[aria-pressed="true"]::after{
    content:'☀';
    transform:translateX(18px);
}

.search-container{
    padding:18px;
    border-bottom:1px solid var(--glass-border);
    position:relative;
}

.workspace-tools{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.workspace-tools select,
.workspace-tools button{
    width:auto;
    min-width:0;
    height:30px;
    padding:0 9px;
    border-radius:9px;
    color:var(--text-main);
    background:var(--btn-bg);
    border:1px solid var(--glass-border);
    font-size:11px;
}

.workspace-tools button.active{background:#fff;color:#000}

.search-history{
    display:none;
    position:absolute;
    left:18px;
    right:18px;
    top:68px;
    z-index:4;
    padding:6px;
    border-radius:10px;
}

.search-history.open{display:block}
.history-item{padding:8px;border-radius:7px;cursor:pointer;color:var(--text-muted);font-size:11px}
.history-item:hover{background:var(--btn-bg);color:var(--text-main)}

#search-bar{
    width:100%;

    padding:12px 18px;

    border-radius:var(--radius-pill);

    border:1px solid var(--glass-border);

    background:var(--btn-bg);

    color:var(--text-main);

    outline:none;
}

.sidebar-scroll-area{
    overflow-y:auto;
    flex-grow:1;

    padding:10px;
}

.folder-group{
    margin-left:15px;

    border-left:1px solid var(--glass-border);

    padding-left:5px;

    display:none;
}

.folder-group.open{
    display:block;
}

.item-row{
    display:flex;
    align-items:center;

    padding:10px 12px;

    border-radius:10px;

    cursor:pointer;

    color:var(--text-muted);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    user-select:none;

    transition:background .2s ease,color .2s ease,transform .2s ease;
    content-visibility:auto;
    contain-intrinsic-size:38px;
}

#tree-container.grid-view,
#search-results.grid-view,
#recent-files.grid-view{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px;
}

.grid-view .item-row{
    min-height:110px;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    white-space:normal;
    overflow-wrap:anywhere;
}

.grid-view ul{
    display:contents;
}

.grid-view .icon{
    margin:0 0 8px;
    font-size:24px;
}

.file-thumb{
    width:44px;
    height:44px;
    object-fit:cover;
    border-radius:8px;
    margin:0 8px 0 0;
}

.grid-view .file-thumb{
    width:56px;
    height:56px;
    margin:0 0 8px;
}

.item-row.favorite::after{content:'★';color:#facc15;margin-left:auto}
.grid-view .item-row.favorite::after{margin:6px 0 0}

.item-row:hover{
    background:var(--btn-bg);

    color:var(--text-main);
}

.item-row.active{
    background:#fff;

    color:#000;
}

.arrow{
    width:12px;

    margin-right:6px;

    font-size:10px;
}

.folder-row.open .arrow{
    transform:rotate(90deg);
}

.icon{
    margin-right:8px;
}

.watermark{
    padding:15px;

    border-top:1px solid var(--glass-border);

    display:flex;
    justify-content:center;
}

.watermark img{
    width:220px;

    loading:lazy;
}

.recent-heading{
    padding:12px 12px 6px;
    color:var(--text-muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

#recent-files:empty + .recent-heading{
    display:none;
}

.skeleton-row{
    height:38px;
    margin:4px 0;
    border-radius:10px;
    background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.16),rgba(255,255,255,.05));
    background-size:200% 100%;
    animation:shimmer 1.2s ease-in-out infinite;
}

.dropzone{
    padding:18px;
    border:1px dashed rgba(255,255,255,.25);
    border-radius:14px;
    text-align:center;
    color:var(--text-muted);
    transition:background .2s ease,border-color .2s ease;
}

.dropzone.dragover{
    background:rgba(96,165,250,.16);
    border-color:#60a5fa;
    color:#fff;
}

.upload-progress-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:150px;
    overflow-y:auto;
}

.upload-progress-item{
    font-size:11px;
    color:var(--text-muted);
}

.progress-track{
    height:5px;
    margin-top:5px;
    overflow:hidden;
    border-radius:5px;
    background:rgba(255,255,255,.1);
}

.progress-bar{
    width:0;
    height:100%;
    background:#60a5fa;
    transition:width .15s ease;
}

#toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:3000;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
}

.toast{
    min-width:220px;
    max-width:360px;
    padding:12px 14px;
    border-radius:12px;
    color:#fff;
    background:rgba(25,25,30,.9);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    animation:toast-in .25s ease both;
    pointer-events:auto;
    font-size:12px;
}

.toast.error{border-color:#f87171}
.toast.success{border-color:#4ade80}

#debug-panel{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:3000;
    display:none;
    width:min(420px,calc(100vw - 40px));
    max-height:220px;
    overflow:auto;
    padding:14px;
    border-radius:14px;
    color:#cbd5e1;
    background:rgba(8,10,15,.94);
    border:1px solid var(--glass-border);
    font:11px/1.5 monospace;
    white-space:pre-wrap;
}

#debug-panel.open{display:block}

#context-menu{
    position:fixed;
    z-index:3500;
    display:none;
    min-width:170px;
    padding:6px;
    border-radius:12px;
}

#context-menu.open{display:block}
.context-action{display:block;width:100%;height:32px;min-width:0;padding:0 10px;border:0;background:none;color:var(--text-main);border-radius:7px;text-align:left;box-shadow:none}
.context-action:hover{background:var(--btn-bg)}

#file-info-panel{
    position:absolute;
    top:12px;
    right:12px;
    z-index:8;
    display:none;
    width:min(280px,calc(100% - 24px));
    padding:16px;
    border-radius:14px;
    font-size:12px;
}

#file-info-panel.open{display:block}
.info-title{font-weight:600;margin-bottom:10px;overflow-wrap:anywhere}
.info-line{color:var(--text-muted);margin:6px 0}

@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =========================
   MAIN
========================= */

main{
    position:absolute;

    top:84px;
    bottom:12px;
    left:12px;
    right:12px;

    overflow:hidden;

    border-radius:var(--radius-large);

    background:#000;
}

#iframe-wrapper{
    width:100%;
    height:100%;

    transform-origin:top center;

    transition:transform .2s;
}

#file-viewer{
    width:100%;
    height:100%;

    border:none;

    display:none;

    background:#fff;
}

#placeholder{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:var(--text-muted);

    z-index:5;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    opacity:0;
    pointer-events:none;

    transition:.3s;

    z-index:998;
}

#overlay.active{
    opacity:1;
    pointer-events:all;
}

/* =========================
   MODALS
========================= */

#upload-modal,
#loading-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(4px);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transition:.3s;

    z-index:2000;
}

#upload-modal.active,
#loading-overlay.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    width:90%;
    max-width:450px;

    border-radius:var(--radius-large);

    padding:25px;

    display:flex;
    flex-direction:column;

    gap:15px;
}

.modal-folder-list{
    height:220px;

    overflow-y:auto;

    border:1px solid var(--glass-border);

    border-radius:10px;

    padding:10px;
}

.modal-folder{
    padding:10px;

    border-radius:8px;

    cursor:pointer;
}

.modal-folder:hover{
    background:var(--btn-bg);
}

.modal-actions{
    display:flex;

    gap:10px;
}

.modal-actions input{
    flex-grow:1;

    padding:10px;

    border-radius:10px;

    border:1px solid var(--glass-border);

    background:var(--btn-bg);

    color:var(--text-main);
}

.breadcrumb{
    font-size:12px;

    color:var(--text-muted);

    display:flex;
    flex-wrap:wrap;

    gap:5px;
}

.breadcrumb span{
    color:#60a5fa;

    cursor:pointer;
}

.btn-primary{
    background:#fff;

    color:#000;
}

/* =========================
   LOADING
========================= */

.spinner{
    width:50px;
    height:50px;

    border:5px solid rgba(255,255,255,.1);
    border-top-color:#fff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.viewer-loading #placeholder{
    display:flex;
}

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   DESKTOP
========================= */

@media(min-width:768px){

    #sidebar{
        left:12px;
    }

    main{
        left:304px;
    }

    #overlay.active{
        opacity:0;
        pointer-events:none;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    header{
        padding:0 6px;
    }

    .header-left,
    .header-right{
        gap:4px;
    }

    button{
        min-width:36px;
        width:36px;
        height:36px;
    }

    button svg{
        width:16px;
        height:16px;
    }

    .zoom-controls{
        padding:1px;
    }

    .zoom-controls button{
        width:30px;
        height:30px;
        min-width:30px;
    }

    #zoom-display{
        min-width:32px;
        font-size:10px;
    }
}

</style>
</head>

<body>

<div id="loading-overlay">
    <div class="spinner" role="status" aria-label="Uploading"></div>
</div>

<div id="upload-modal" role="dialog" aria-modal="true" aria-label="Upload file">

    <div class="modal-box glass-panel">

        <div class="breadcrumb"
             id="modal-breadcrumb"></div>

        <div class="modal-folder-list"
             id="modal-folder-list"></div>

        <div class="dropzone" id="upload-dropzone" tabindex="0">
            Drop files here or choose files below
        </div>

        <div class="upload-progress-list" id="upload-progress-list"></div>

        <div class="modal-actions">
            <input type="text" id="new-folder-name" placeholder="New folder name" maxlength="120">
            <button id="create-folder-btn" type="button" aria-label="Create folder" title="Create folder">Create</button>
        </div>

        <div class="modal-actions">

            <button id="cancel-upload-btn" type="button" title="Cancel upload">
                Cancel
            </button>

            <button id="confirm-upload-btn" type="button" aria-label="Choose file" title="Choose file"
                    class="btn-primary">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>

                </svg>

            </button>

                 <button id="choose-folder-btn" type="button" aria-label="Choose folder" title="Choose folder">Folder</button>

            <input type="file"
                   id="file-input"
                                     accept="*/*"
                                     multiple
                   style="display:none;">

                 <input type="file"
                     id="folder-input"
                     webkitdirectory
                     directory
                     multiple
                     style="display:none;">

        </div>

    </div>

</div>

<header class="glass-panel">

    <div class="header-left">

        <button id="sidebar-toggle-btn" class="sidebar-toggle" type="button" aria-label="Toggle file list" aria-pressed="false" title="Open or close file list"></button>

        <button id="theme-toggle-btn" class="theme-toggle" type="button" aria-label="Switch to white theme" aria-pressed="false" title="Switch to white theme"></button>

        <div class="sync-dot"
             id="sync-indicator"></div>

    </div>

    <div class="header-right">

        <div class="zoom-controls">

            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">-</button>

            <span id="zoom-display">
                100%
            </span>

            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>

        </div>

        <button id="refresh-btn" aria-label="Refresh files" title="Refresh files">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10"/>
                <path d="M20.49 15a9 9 0 0 1-14.13 3.36L1 14"/>

            </svg>

        </button>

        <button id="download-btn" aria-label="Download file" title="Download file">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>

            </svg>

        </button>

        <button id="upload-btn" aria-label="Upload file" title="Upload file">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>

            </svg>

        </button>

        <button id="fullscreen-btn" aria-label="Toggle fullscreen" title="Toggle fullscreen">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>

            </svg>

        </button>

    </div>

</header>

<div id="overlay"></div>

<div id="toast-container" aria-live="polite"></div>
<div id="debug-panel" aria-live="polite"></div>
<div id="context-menu" class="glass-panel" role="menu"></div>

<nav id="sidebar"
     class="glass-panel">

<div class="search-container">

<input type="search"
       id="search-bar"
    aria-label="Search files"
       placeholder="Search files...">

<div class="workspace-tools" aria-label="File view controls">
    <select id="file-filter" aria-label="Filter files" title="Filter files">
        <option value="all">All files</option>
        <option value="document">Documents</option>
        <option value="image">Images</option>
        <option value="video">Videos</option>
        <option value="audio">Audio</option>
        <option value="application/pdf">PDFs</option>
    </select>
    <button id="favorites-filter" type="button" aria-pressed="false" title="Show favorites only">Favorites</button>
    <button id="view-mode-toggle" type="button" aria-pressed="false" title="Switch to grid view">Grid</button>
</div>

<div id="tree-container"></div>

</div>

    alt="">

</div>

<svg width="48"
     height="48"

     fill="none"

Select a file from sidebar
</p>

<script>

/* KEEP YOUR EXISTING JS HERE */
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzE5oepDHsr3BJpTRZxx2wDYq0PnmP1wAnKBqkL_HYrRooWVrzojX4TMvULEbeTN9MXJg/exec";

const ROOT_FOLDER_ID =
"1ztsTJCXPBFzIYeOLSyZkZebjlTYyB1JK";

const CACHE_KEY =
"drive_tree_cache_v8";

const RECENT_FILES_KEY =
"drive_recent_files_v1";

const MAX_RECENT_FILES = 8;

const SEARCH_HISTORY_KEY =
"drive_search_history_v1";

const FAVORITES_KEY =
"drive_favorites_v1";

const VIEW_MODE_KEY =
"drive_view_mode_v1";

let fullTreeData = [];
let allFlatFiles = [];
let currentZoom = 100;
let activeFileId = null;
let folderNavigationPath = [];
let lastFocusedElement = null;
let selectedFiles = new Set();
let activeFile = null;
let activeRotation = 0;
let currentFilter = 'all';
let favoritesOnly = false;
let requestInFlight = false;

const sidebar =
document.getElementById('sidebar');

const overlay =
document.getElementById('overlay');

const treeContainer =
document.getElementById('tree-container');

const searchResults =
document.getElementById('search-results');

const fileViewer =
document.getElementById('file-viewer');

const iframeWrapper =
document.getElementById('iframe-wrapper');

const placeholder =
document.getElementById('placeholder');

const searchBar =
document.getElementById('search-bar');

const downloadBtn =
document.getElementById('download-btn');

const syncIndicator =
document.getElementById('sync-indicator');

const uploadModal =
document.getElementById('upload-modal');

const main =
document.querySelector('main');

const recentFiles =
document.getElementById('recent-files');

const toastContainer =
document.getElementById('toast-container');

const debugPanel =
document.getElementById('debug-panel');

const contextMenu =
document.getElementById('context-menu');

const fileInfoPanel =
document.getElementById('file-info-panel');

const searchHistoryPanel =
document.getElementById('search-history');

const dbPromise = new Promise(resolve=>{
    if(!window.indexedDB){ resolve(null); return; }
    const request = indexedDB.open('drive-workspace',1);
    request.onupgradeneeded = ()=>request.result.createObjectStore('cache');
    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>resolve(null);
});

async function storeOfflineTree(data){
    try{
        const db = await dbPromise;
        if(!db) return;
        const transaction = db.transaction('cache','readwrite');
        transaction.objectStore('cache').put(data,'tree');
    } catch(error){
        debug('Offline cache write skipped',error);
    }
}

async function readOfflineTree(){
    try{
        const db = await dbPromise;
        if(!db) return null;
        return await new Promise(resolve=>{
            const request = db.transaction('cache').objectStore('cache').get('tree');
            request.onsuccess = ()=>resolve(request.result);
            request.onerror = ()=>resolve(null);
        });
    } catch(error){
        debug('Offline cache read skipped',error);
        return null;
    }
}

function favoriteIds(){
    try{
        const parsed = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
        return new Set(Array.isArray(parsed) ? parsed : []);
    } catch(error){
        debug('Could not read favorites',error);
        return new Set();
    }
}

function setFavorite(file){
    const ids = favoriteIds();
    if(ids.has(file.id)) ids.delete(file.id); else ids.add(file.id);
    localStorage.setItem(FAVORITES_KEY,JSON.stringify([...ids]));
    renderTreeData(fullTreeData);
    renderRecentFiles();
    showToast(ids.has(file.id) ? 'Added to favorites' : 'Removed from favorites','success');
}

function fileMatches(file){
    const mime = String(file.mimeType || '').toLowerCase();
    const name = String(file.name || '').toLowerCase();
    if(favoritesOnly && !favoriteIds().has(file.id)) return false;
    if(currentFilter === 'all') return true;
    if(currentFilter === 'document') return mime.includes('document') || mime.includes('text') || /\.(docx?|xlsx?|pptx?|txt|csv)$/i.test(name);
    return mime.includes(currentFilter);
}

function highlightText(text,term){
    const fragment = document.createDocumentFragment();
    const safeText = String(text || '');
    if(!term){ fragment.appendChild(document.createTextNode(safeText)); return fragment; }
    const pattern = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig');
    safeText.split(pattern).forEach(part=>{
        const node = document.createTextNode(part);
        if(part.toLowerCase() === term.toLowerCase()){
            const mark = document.createElement('mark');
            mark.appendChild(node);
            fragment.appendChild(mark);
        } else fragment.appendChild(node);
    });
    return fragment;
}

function renderFileInfo(file){

    if(!file){ fileInfoPanel.classList.remove('open'); return; }
    fileInfoPanel.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'info-title';
    title.textContent = String(file.name || 'Selected file');
    fileInfoPanel.appendChild(title);
    const details = [
        ['Type',String(file.mimeType || 'Unknown')],
        ['ID',String(file.id || 'Unknown')],
        ['Size',file.size ? formatBytes(file.size) : 'Not provided']
    ];
    details.forEach(([label,value])=>{
        const line = document.createElement('div');
        line.className = 'info-line';
        line.textContent = `${label}: ${value}`;
        fileInfoPanel.appendChild(line);
    });
    const actions = document.createElement('div');
    actions.className = 'workspace-tools';
    [['Rotate',()=>rotateImage()],['Copy link',()=>copyFileLink(file)],['Share',()=>shareFile(file)]].forEach(([label,run])=>{
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = label; button.title = label; button.onclick = run;
        actions.appendChild(button);
    });
    fileInfoPanel.appendChild(actions);
    fileInfoPanel.classList.add('open');
}

function formatBytes(bytes){
    if(!Number.isFinite(Number(bytes)) || Number(bytes) < 1) return '0 B';
    const units = ['B','KB','MB','GB'];
    const power = Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),units.length - 1);
    return `${(bytes / 1024 ** power).toFixed(power ? 1 : 0)} ${units[power]}`;
}

function getViewerSource(fileId,file){
    const mime = String(file && file.mimeType || '').toLowerCase();
    if(mime.startsWith('image/') || mime.startsWith('video/') || mime.startsWith('audio/')){
        return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(fileId)}`;
    }
    const downloadUrl = `https://drive.google.com/uc?id=${encodeURIComponent(fileId)}&export=download`;
    return `https://drive.google.com/viewerng/viewer?embedded=true&url=${encodeURIComponent(downloadUrl)}`;
}

function rotateImage(){
    if(!activeFile || !String(activeFile.mimeType || '').startsWith('image/')){
        showToast('Rotation is available for images','error'); return;
    }
    activeRotation = (activeRotation + 90) % 360;
    fileViewer.style.transform = `rotate(${activeRotation}deg)`;
}

async function copyFileLink(file){
    const link = `https://drive.google.com/uc?id=${encodeURIComponent(file.id)}`;
    try{
        await navigator.clipboard.writeText(link);
        showToast('File link copied','success');
    } catch(error){
        debug('Could not copy file link',error);
        showToast(link,'info');
    }
}

async function postCommand(action,payload){
    if(requestInFlight) throw new Error('Another request is already running');
    requestInFlight = true;
    try{
        const response = await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,...payload})});
        let result;
        try{ result = await response.json(); }
        catch(error){ throw new Error(`${action} returned an invalid response`); }
        if(!response.ok || !result || result.status !== 'success'){
            throw new Error(result && result.message ? result.message : `${action} failed`);
        }
        return result;
    } finally { requestInFlight = false; }
}

async function renameFile(file){
    const name = window.prompt('New file name',String(file.name || ''));
    if(!name || !name.trim() || name.trim() === file.name) return;
    try{
        await postCommand('rename',{fileId:file.id,newName:name.trim()});
        showToast('File renamed','success');
        await strictRefresh();
    } catch(error){ debug('Rename failed',error); showToast('Rename is unavailable on the connected service','error'); }
}

async function createFolder(){
    const input = document.getElementById('new-folder-name');
    const name = input.value.trim();
    const parent = folderNavigationPath[folderNavigationPath.length - 1];
    if(!name || !parent) return;
    try{
        await postCommand('createFolder',{parentId:parent.id,name,folderName:name});
        input.value = '';
        showToast('Folder created','success');
        await strictRefresh();
        renderModal();
    } catch(error){ debug('Create folder failed',error); showToast('Folder creation is unavailable on the connected service','error'); }
}

async function shareFile(file){
    try{
        const result = await postCommand('share',{fileId:file.id});
        if(result && result.url){ await navigator.clipboard.writeText(result.url); showToast('Share link copied','success'); }
        else showToast('Share link was not returned by the service','error');
    } catch(error){ debug('Share failed',error); showToast('Sharing is unavailable on the connected service','error'); }
}

function showContextMenu(event,file){
    event.preventDefault();
    contextMenu.innerHTML = '';
    [['Open',()=>loadFile(file.id,event.currentTarget,file)],['Favorite',()=>setFavorite(file)],['Rename',()=>renameFile(file)],['Copy link',()=>copyFileLink(file)],['Info',()=>renderFileInfo(file)]].forEach(([label,run])=>{
        const button = document.createElement('button');
        button.className = 'context-action'; button.type = 'button'; button.textContent = label; button.setAttribute('role','menuitem');
        button.onclick = ()=>{ contextMenu.classList.remove('open'); run(); };
        contextMenu.appendChild(button);
    });
    contextMenu.style.left = `${Math.min(event.clientX,window.innerWidth - 190)}px`;
    contextMenu.style.top = `${Math.min(event.clientY,window.innerHeight - 220)}px`;
    contextMenu.classList.add('open');
}

function showToast(message,type='info',action){

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;

    if(action){
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = action.label;
        button.style.cssText = 'width:auto;height:28px;min-width:0;padding:0 10px;margin-left:10px;display:inline-flex;';
        button.onclick = ()=>{
            action.run();
            toast.remove();
        };
        toast.appendChild(button);
    }

    toastContainer.appendChild(toast);
    window.setTimeout(()=>toast.remove(),5000);
}

function debug(message,error){

    const entry = `${new Date().toLocaleTimeString()} ${message}${error ? `\n${error.stack || error}` : ''}`;
    debugPanel.textContent = `${entry}\n${debugPanel.textContent}`.slice(0,6000);
    console.error(message,error || '');
}

function getRecentFiles(){

    try{
        const parsed = JSON.parse(localStorage.getItem(RECENT_FILES_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
    } catch(error){
        debug('Could not read recent files',error);
        return [];
    }
}

function saveRecentFile(file){

    const files = [file,...getRecentFiles().filter(item=>item.id !== file.id)]
    .slice(0,MAX_RECENT_FILES);

    try{
        localStorage.setItem(RECENT_FILES_KEY,JSON.stringify(files));
    } catch(error){
        debug('Could not save recent file',error);
    }

    renderRecentFiles();
}

function createFileRow(file){

    const row = document.createElement('div');
    row.className = 'item-row';
    row.tabIndex = 0;
    row.setAttribute('role','button');
    row.setAttribute('aria-label',`Open ${String(file.name || 'Unnamed file')}`);
    row.dataset.fileId = String(file.id || '');
    row.draggable = false;
    if(favoriteIds().has(file.id)) row.classList.add('favorite');

    if(String(file.mimeType || '').startsWith('image/') && file.id){
        const thumbnail = document.createElement('img');
        thumbnail.className = 'file-thumb';
        thumbnail.alt = '';
        thumbnail.loading = 'lazy';
        thumbnail.src = `https://drive.google.com/uc?export=view&id=${encodeURIComponent(file.id)}`;
        row.appendChild(thumbnail);
    }

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = getIcon(file.mimeType);
    row.append(icon,highlightText(file.name || 'Unnamed file',searchBar.value.trim()));
    row.onclick = event=>{
        if(event.ctrlKey || event.metaKey){
            row.classList.toggle('active');
            if(row.classList.contains('active')) selectedFiles.add(file.id); else selectedFiles.delete(file.id);
            return;
        }
        loadFile(file.id,row,file);
    };
    row.oncontextmenu = event=>showContextMenu(event,file);
    row.onkeydown = event=>{
        if(event.key === 'Enter' || event.key === ' '){
            event.preventDefault();
            row.click();
        }
    };
    return row;
}

function renderRecentFiles(){
    if(!recentFiles) return;
    recentFiles.innerHTML = '';
    getRecentFiles().forEach(file=>recentFiles.appendChild(createFileRow(file)));
}

function getViewMode(){
    return localStorage.getItem(VIEW_MODE_KEY) === 'grid' ? 'grid' : 'list';
}

function applyViewMode(){
    const isGrid = getViewMode() === 'grid';
    treeContainer.classList.toggle('grid-view',isGrid);
    searchResults.classList.toggle('grid-view',isGrid);
    if(recentFiles) recentFiles.classList.toggle('grid-view',isGrid);
}

const fileFilter = document.getElementById('file-filter');
const favoritesFilter = document.getElementById('favorites-filter');
const viewModeToggle = document.getElementById('view-mode-toggle');

const initialViewMode = getViewMode();
viewModeToggle.textContent = initialViewMode === 'grid' ? 'List' : 'Grid';
viewModeToggle.title = initialViewMode === 'grid' ? 'Switch to list view' : 'Switch to grid view';
viewModeToggle.setAttribute('aria-pressed',String(initialViewMode === 'grid'));

fileFilter.onchange = event=>{
    currentFilter = event.target.value;
    renderTreeData(fullTreeData);
    renderSearchResults(searchBar.value);
};

favoritesFilter.onclick = ()=>{
    favoritesOnly = !favoritesOnly;
    favoritesFilter.classList.toggle('active',favoritesOnly);
    favoritesFilter.setAttribute('aria-pressed',String(favoritesOnly));
    renderTreeData(fullTreeData);
    renderSearchResults(searchBar.value);
};

viewModeToggle.onclick = ()=>{
    const nextMode = getViewMode() === 'grid' ? 'list' : 'grid';
    localStorage.setItem(VIEW_MODE_KEY,nextMode);
    viewModeToggle.textContent = nextMode === 'grid' ? 'List' : 'Grid';
    viewModeToggle.title = nextMode === 'grid' ? 'Switch to list view' : 'Switch to grid view';
    viewModeToggle.setAttribute('aria-pressed',String(nextMode === 'grid'));
    applyViewMode();
};

function showSkeleton(){

    treeContainer.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for(let index=0;index<7;index++){
        const row = document.createElement('div');
        row.className = 'skeleton-row';
        fragment.appendChild(row);
    }
    treeContainer.appendChild(fragment);
}

function applyZoom(){

    iframeWrapper.style.transform =
    `scale(${currentZoom/100})`;

    document.getElementById('zoom-display')
    .textContent = `${currentZoom}%`;
}

document.getElementById('zoom-in')
.onclick = ()=>{

    currentZoom = Math.min(200,currentZoom + 10);

    applyZoom();
};

document.getElementById('zoom-out')
.onclick = ()=>{

    if(currentZoom > 50){

        currentZoom -= 10;

        applyZoom();
    }
};

downloadBtn.onclick = ()=>{

    if(!activeFileId) return;

    const a =
    document.createElement('a');

    a.href =
    `https://drive.google.com/uc?export=download&id=${encodeURIComponent(activeFileId)}`;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);
};

function getIcon(mimeType){

    mimeType = typeof mimeType === 'string' ? mimeType : '';

    if(mimeType.includes('pdf')) return '📄';

    if(mimeType.includes('image')) return '🖼️';

    if(mimeType.includes('video')) return '🎥';

    return '📄';
}

function renderTreeData(data){

    if(!Array.isArray(data)) data = [];

    allFlatFiles = [];

    const frag = document.createDocumentFragment();
    buildTree(data,frag);

    treeContainer.innerHTML = '';

    treeContainer.appendChild(frag);
    applyViewMode();
}

function buildTree(data, container){

    const ul =
    document.createElement('ul');

    data.forEach(item=>{

        if(!item || typeof item !== 'object') return;

        if(item.type === 'folder'){

            const row =
            document.createElement('div');

            row.className =
            'item-row folder-row';
            row.tabIndex = 0;
            row.setAttribute('role','button');
            row.setAttribute('aria-expanded','false');
            row.setAttribute('aria-label',`Open folder ${String(item.name || 'Unnamed folder')}`);

            row.innerHTML = '<span class="arrow">▶</span><span class="icon">📁</span>';
            row.append(document.createTextNode(String(item.name || 'Unnamed folder')));

            const children =
            document.createElement('div');

            children.className =
            'folder-group';

            buildTree(Array.isArray(item.children) ? item.children : [], children);

            row.onclick = ()=>{

                row.classList.toggle('open');

                children.classList.toggle('open');
                row.setAttribute('aria-expanded',String(children.classList.contains('open')));
            };

            row.onkeydown = event=>{
                if(event.key === 'Enter' || event.key === ' '){
                    event.preventDefault();
                    row.click();
                }
            };

            ul.appendChild(row);
            ul.appendChild(children);

        } else {

            if(!fileMatches(item)) return;

            const row = createFileRow(item);

            ul.appendChild(row);

            allFlatFiles.push(item);
        }
    });

    container.appendChild(ul);
}

function loadFile(fileId, element,file){

    document.querySelectorAll('.item-row')
    .forEach(i=>i.classList.remove('active'));

    element.classList.add('active');

    activeFileId = fileId;
    activeFile = file || allFlatFiles.find(item=>item.id === fileId) || {id:fileId,name:'Selected file'};
    activeRotation = 0;

    if(file) saveRecentFile({
        id:file.id,
        name:String(file.name || 'Unnamed file'),
        mimeType:file.mimeType || ''
    });

    downloadBtn.style.display = 'flex';

    placeholder.style.display = 'none';

    fileViewer.style.display = 'block';
    fileViewer.style.transform = 'rotate(0deg)';

    fileViewer.src = getViewerSource(fileId,activeFile);

    currentZoom = 100;

    applyZoom();
    renderFileInfo(activeFile);

    if(window.innerWidth < 768){

        sidebar.classList.remove('open');

        overlay.classList.remove('active');
    }
}

async function strictRefresh(){

    const refreshBtn =
    document.getElementById('refresh-btn');

    refreshBtn.classList.add('loading');

    syncIndicator.classList.add('active');
    showSkeleton();

    try{

        const res =
        await fetch(
            SCRIPT_URL + '?mode=tree&force=1&t=' + Date.now(),
            {
                cache:'no-store'
            }
        );

        if(!res.ok) throw new Error(`Refresh failed (${res.status})`);

        const data = await res.json();
        if(!Array.isArray(data)) throw new Error('Refresh returned invalid data');

        try{
            localStorage.setItem(CACHE_KEY,JSON.stringify(data));
        } catch(storageError){
            console.warn('Could not save file cache',storageError);
        }

        fullTreeData = data;
        await storeOfflineTree(data);

        renderTreeData(data);
        renderRecentFiles();
        showToast('Files refreshed','success');

    } catch(err){

        debug('Refresh failed',err);
        showToast('Could not refresh files','error',{
            label:'Retry',
            run:strictRefresh
        });

    } finally {

        refreshBtn.classList.remove('loading');

        syncIndicator.classList.remove('active');
    }
}

async function initializeApp(){

    let cached = null;
    try{
        cached = localStorage.getItem(CACHE_KEY);
    } catch(storageError){
        console.warn('Could not read file cache',storageError);
    }

    if(cached){

        try{
            const parsed = JSON.parse(cached);
            if(Array.isArray(parsed)){
                fullTreeData = parsed;
                renderTreeData(fullTreeData);
            }
        } catch(parseError){
            console.warn('Ignoring invalid file cache',parseError);
        }
    }

    if(!fullTreeData.length){
        const offlineTree = await readOfflineTree();
        if(Array.isArray(offlineTree)){
            fullTreeData = offlineTree;
            renderTreeData(offlineTree);
            showToast('Showing offline files','info');
        }
    }

    await strictRefresh();
}

let searchTimer;

function getSearchHistory(){
    try{
        const history = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
        return Array.isArray(history) ? history : [];
    } catch(error){ return []; }
}

function saveSearchTerm(term){
    if(!term) return;
    const history = [term,...getSearchHistory().filter(item=>item !== term)].slice(0,8);
    localStorage.setItem(SEARCH_HISTORY_KEY,JSON.stringify(history));
}

function renderSearchHistory(){
    if(!searchHistoryPanel) return;
    searchHistoryPanel.innerHTML = '';
    getSearchHistory().forEach(term=>{
        const item = document.createElement('div');
        item.className = 'history-item'; item.textContent = term;
        item.onclick = ()=>{ searchBar.value = term; renderSearchResults(term); searchHistoryPanel.classList.remove('open'); };
        searchHistoryPanel.appendChild(item);
    });
}

searchBar.addEventListener('input', e=>{

    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>renderSearchResults(e.target.value),150);
});

searchBar.addEventListener('keydown',event=>{
    if(event.key === 'Enter'){
        saveSearchTerm(searchBar.value.trim());
    }
});

function renderSearchResults(value){

    const term = String(value || '').toLowerCase().trim();

    if(!term){

        treeContainer.style.display='block';

        searchResults.style.display='none';

        return;
    }

    treeContainer.style.display='none';

    searchResults.style.display='block';

    searchResults.innerHTML='';

    allFlatFiles
    .filter(fileMatches)
    .filter(f=>String(f.name || '').toLowerCase().includes(term))
    .forEach(file=>{

        const row = createFileRow(file);

        searchResults.appendChild(row);
    });
    applyViewMode();
}

overlay.onclick = ()=>{

    sidebar.classList.remove('open');

    overlay.classList.remove('active');
};

document.getElementById('fullscreen-btn')
.onclick = ()=>{

    if(!document.fullscreenElement){

        main
        .requestFullscreen();

    } else {

        document.exitFullscreen();
    }
};

document.getElementById('refresh-btn')
.onclick = strictRefresh;

const SIDEBAR_STATE_KEY = 'drive_sidebar_state_v1';
const sidebarToggle = document.getElementById('sidebar-toggle-btn');

function setSidebarOpen(isOpen){
    sidebar.classList.toggle('closed',!isOpen);
    sidebar.classList.toggle('open',isOpen && window.innerWidth < 768);
    document.body.classList.toggle('sidebar-closed',!isOpen);
    sidebarToggle.setAttribute('aria-pressed',String(!isOpen));
    sidebarToggle.title = isOpen ? 'Close file list' : 'Open file list';
    localStorage.setItem(SIDEBAR_STATE_KEY,isOpen ? 'open' : 'closed');

let sidebarSwipeStartX = 0;
let sidebarSwipeStartY = 0;
let sidebarSwipeTarget = null;

document.addEventListener('touchstart',event=>{
    if(window.innerWidth >= 768 || event.touches.length !== 1) return;
    sidebarSwipeStartX = event.touches[0].clientX;
    sidebarSwipeStartY = event.touches[0].clientY;
    sidebarSwipeTarget = event.target;
},{passive:true});

document.addEventListener('touchend',event=>{
    if(window.innerWidth >= 768 || event.changedTouches.length !== 1) return;

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;
    const deltaX = endX - sidebarSwipeStartX;
    const deltaY = endY - sidebarSwipeStartY;
    const isHorizontal = Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.35;
    const startedAtEdge = sidebarSwipeStartX <= 28;
    const startedInsideSidebar = sidebarSwipeTarget && sidebar.contains(sidebarSwipeTarget);

    if(!isHorizontal) return;
    if(!sidebar.classList.contains('closed') && startedInsideSidebar && deltaX < 0){
        setSidebarOpen(false);
    } else if(sidebar.classList.contains('closed') && startedAtEdge && deltaX > 0){
        setSidebarOpen(true);
    }
},{passive:true});

function isAllowedFile(file){
    return Boolean(file && file.name);
}

const UPLOAD_CHUNK_SIZE = 24 * 1024 * 1024;
const DIRECT_UPLOAD_LIMIT = 35 * 1024 * 1024;

function readBlobAsBase64(blob){

    return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>{
            const bytes = new Uint8Array(reader.result);
            let binary = '';
            const step = 0x8000;
            for(let index=0;index<bytes.length;index+=step){
                binary += String.fromCharCode(...bytes.subarray(index,index + step));
            }
            resolve(btoa(binary));
        };
        reader.onerror = ()=>reject(new Error('The file could not be read'));
        reader.readAsArrayBuffer(blob);
    });
}

async function retryCommand(action,payload){
    let lastError;
    for(let attempt=0;attempt<3;attempt++){
        try{ return await postCommand(action,payload); }
        catch(error){
            lastError = error;
            if(attempt < 2) await new Promise(resolve=>setTimeout(resolve,700 * (attempt + 1)));
        }
    }
    throw lastError;
}

async function uploadOneFile(file,targetFolder,progressBar){
    const total = file.size;
    if(total <= DIRECT_UPLOAD_LIMIT){
        const base64 = await readBlobAsBase64(file);
        await retryCommand('upload',{
            parentId:targetFolder.id,
            filename:String(file.name || 'unnamed-file'),
            mimeType:file.type || 'application/octet-stream',
            base64
        });
        progressBar.style.width = '100%';
        return;
    }
    let started;
    try{
        started = await retryCommand('uploadStart',{
            parentId:targetFolder.id,
            filename:String(file.name || 'unnamed-file'),
            mimeType:file.type || 'application/octet-stream',
            total
        });
    } catch(error){
        if(!String(error.message || error).includes('script.external_request')) throw error;
        const base64 = await readBlobAsBase64(file);
        await retryCommand('upload',{
            parentId:targetFolder.id,
            filename:String(file.name || 'unnamed-file'),
            mimeType:file.type || 'application/octet-stream',
            base64
        });
        progressBar.style.width = '100%';
        return;
    }
    if(!started.sessionUrl) throw new Error('Upload session was not created');

    let uploaded = 0;
    while(uploaded < total){
        const end = Math.min(uploaded + UPLOAD_CHUNK_SIZE,total);
        const base64 = await readBlobAsBase64(file.slice(uploaded,end));
        await retryCommand('uploadChunk',{
            sessionUrl:started.sessionUrl,
            start:uploaded,
            end:end - 1,
            total,
            base64
        });
        uploaded = end;
        progressBar.style.width = `${total ? uploaded / total * 100 : 100}%`;
    }
}

function findFolderInTree(items,parentId,name){
    for(const item of Array.isArray(items) ? items : []){
        if(item.type === 'folder' && item.name === name){
            if(parentId === ROOT_FOLDER_ID || item.parentId === parentId) return item;
        }
        const nested = findFolderInTree(item.children,parentId,name);
        if(nested) return nested;
    }
    return null;
}

async function refreshAndFindFolder(parentId,name){
    await strictRefresh();
    const directMatch = (items,parent)=>{
        for(const item of Array.isArray(items) ? items : []){
            if(item.type === 'folder' && item.name === name && parent === parentId) return item;
            const match = directMatch(item.children,item.id);
            if(match) return match;
        }
        return null;
    };
    return directMatch(fullTreeData,ROOT_FOLDER_ID);
}

async function resolveUploadFolder(file,rootFolder,folderCache){

    const relativePath = String(file.webkitRelativePath || '');
    const parts = relativePath.split('/').slice(0,-1).filter(Boolean);
    let current = rootFolder;

    for(const part of parts){
        const cacheKey = `${current.id}/${part}`;
        if(folderCache.has(cacheKey)){
            current = folderCache.get(cacheKey);
            continue;
        }

        const existing = Array.isArray(current.children)
        ? current.children.find(item=>item.type === 'folder' && item.name === part)
        : null;

        if(existing){
            current = existing;
        } else {
            const result = await postCommand('createFolder',{
                parentId:current.id,
                name:part,
                folderName:part
            });
            current = result.folderId
            ? {id:result.folderId,name:part,children:[]}
            : await refreshAndFindFolder(current.id,part);

            if(!current || !current.id){
                throw new Error(`Folder was created but could not be located: ${part}`);
            }
        }

        folderCache.set(cacheKey,current);
    }

    return current;
}

async function uploadFiles(files){

    const targetFolder = folderNavigationPath[folderNavigationPath.length - 1];
    if(!targetFolder || !targetFolder.id){
        showToast('Choose a destination folder first','error');
        return;
    }

    const knownNames = new Set(allFlatFiles.map(item=>String(item.name || '').toLowerCase()));
    const queuedNames = new Set();
    const folderCache = new Map();
    const validFiles = Array.from(files).filter(file=>{
        if(!isAllowedFile(file)){
            showToast(`${file.name} is not an allowed file type`,'error');
            return false;
        }
        const normalizedName = String(file.webkitRelativePath || file.name || '').toLowerCase();
        if(knownNames.has(normalizedName) || queuedNames.has(normalizedName)){
            showToast(`${file.name} already exists or is duplicated in this queue`,'error');
            return false;
        }
        queuedNames.add(normalizedName);
        return true;
    });

    if(!validFiles.length) return;

    uploadModal.classList.remove('active');
    uploadProgressList.innerHTML = '';
    document.getElementById('loading-overlay').classList.add('active');

    let successful = 0;
    try{
        for(const file of validFiles){
            const item = document.createElement('div');
            item.className = 'upload-progress-item';
            item.textContent = String(file.name || 'Unnamed file');
            const track = document.createElement('div');
            track.className = 'progress-track';
            const bar = document.createElement('div');
            bar.className = 'progress-bar';
            track.appendChild(bar);
            item.appendChild(track);
            uploadProgressList.appendChild(item);

            try{
                const destination = await resolveUploadFolder(file,targetFolder,folderCache);
                await uploadOneFile(file,destination,bar);
                successful++;
            } catch(error){
                debug(`Upload failed for ${file.name}`,error);
                item.classList.add('error');
            }
        }
    } finally {
        document.getElementById('loading-overlay').classList.remove('active');
        fileInput.value = '';
        folderInput.value = '';
    }

    if(successful) await strictRefresh();
    showToast(`${successful} of ${validFiles.length} file(s) uploaded`,successful === validFiles.length ? 'success' : 'error');
}

        if(e.key === '+' || e.key === '='){
            currentZoom = Math.min(200,currentZoom + 10);
            applyZoom();
        }
        if(e.key === '-'){
            currentZoom = Math.max(50,currentZoom - 10);

            document.getElementById('fullscreen-btn').click();
        }
    }
});

let initialTouchDistance = null;
let lastTap = 0;

main.addEventListener('touchstart',event=>{
    if(event.touches.length === 2){
        initialTouchDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY
        );
    }
});

main.addEventListener('touchmove',event=>{
    if(event.touches.length !== 2 || !initialTouchDistance) return;
    const distance = Math.hypot(
        event.touches[0].clientX - event.touches[1].clientX,
        event.touches[0].clientY - event.touches[1].clientY
    );
    if(Math.abs(distance - initialTouchDistance) > 24){
        currentZoom = Math.max(50,Math.min(200,currentZoom + (distance > initialTouchDistance ? 10 : -10)));
        applyZoom();
        initialTouchDistance = distance;
    }
});

main.addEventListener('touchend',()=>{
    initialTouchDistance = null;
    const now = Date.now();
    if(now - lastTap < 300){
        currentZoom = currentZoom === 100 ? 125 : 100;
        applyZoom();
    }
    lastTap = now;
});

    debug('Unexpected application error',event.error || event.message);
    showToast('Something went wrong. Open the debug panel for details','error');

window.addEventListener('unhandledrejection',event=>{
    debug('Unhandled async error',event.reason);
