<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <!-- Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <link rel="icon" type="image/png" href="https://ik.imagekit.io/22h7wv5o2/b___Ultra_Detailed_Ima.png?updatedAt=1778874059723">
  <title>Drive Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #050505;
      --glass-bg: rgba(20, 20, 24, .65);
      --glass-border: rgba(255, 255, 255, .08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, .5);
      --text-main: #e2e2e6;
      --text-muted: #8b8b98;
      --btn-bg: rgba(255, 255, 255, .10);
      --btn-hover: rgba(255, 255, 255, .18);
      --accent-active: #fff;
      --accent-text: #000;
      --radius-large: 24px;
      --radius-pill: 50px;
      --font-code: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 50%, rgba(70,50,120,.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(50,90,120,.15), transparent 40%);
      color: var(--text-main);
      overflow: hidden;
      height: 100dvh;
    }

    body.white-theme {
      --bg-base: #eef2f7;
      --glass-bg: rgba(255, 255, 255, .78);
      --glass-border: rgba(15, 23, 42, .14);
      --glass-shadow: 0 8px 32px rgba(15, 23, 42, .16);
      --text-main: #172033;
      --text-muted: #526075;
      --btn-bg: rgba(15, 23, 42, .08);
      --btn-hover: rgba(15, 23, 42, .14);
      background: var(--bg-base);
      color: var(--text-main);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--btn-hover);
      border-radius: 10px;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* =========================
       HEADER
       ========================= */
    header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 58px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 1000;
      overflow: hidden;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .header-right {
      margin-left: auto;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
      opacity: 0;
      flex-shrink: 0;
      transition: opacity .3s ease;
    }

    .sync-dot.active {
      opacity: 1;
    }

    button, .neu-btn {
      flex-shrink: 0;
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .25s ease;
      color: var(--text-main);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 4px 12px rgba(0, 0, 0, .35);
      font-size: 12px;
      font-weight: 500;
    }

    button:hover, .neu-btn:hover {
      background: rgba(255, 255, 255, .24);
      border-color: rgba(255, 255, 255, .2);
      box-shadow: 0 0 18px rgba(255, 255, 255, .08), 0 6px 16px rgba(0, 0, 0, .4);
    }

    .neu-btn-primary {
      background: #fff;
      color: #000;
      font-weight: 600;
    }

    .neu-btn-primary:hover {
      background: #e2e2e6;
    }

    button:focus-visible,
    .item-row:focus-visible,
    .modal-folder:focus-visible,
    #upload-dropzone:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    button:disabled, .neu-btn:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    #upload-btn {
      background: rgba(255, 255, 255, 0.28);
    }

    #download-btn {
      background: rgba(255, 255, 255, 0.28);
      display: none;
    }

    #refresh-btn.loading svg {
      animation: spin 1s linear infinite;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      background: var(--btn-bg);
      border-radius: var(--radius-pill);
      padding: 2px;
      flex-shrink: 1;
    }

    .zoom-controls button {
      min-width: 34px;
      width: 34px;
      height: 34px;
      background: none;
      border: none;
      box-shadow: none;
    }

    #zoom-display {
      min-width: 38px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* =========================
       SIDEBAR
       ========================= */
    #sidebar {
      position: fixed;
      top: 84px;
      left: -320px;
      width: 280px;
      height: calc(100dvh - 96px);
      border-radius: var(--radius-large);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: left .35s ease;
      z-index: 999;
    }

    #sidebar.open {
      left: 12px;
    }

    #sidebar.closed {
      left: -320px;
    }

    body.sidebar-closed main {
      left: 12px;
    }

    .sidebar-toggle, .theme-toggle {
      position: relative;
      width: 42px;
      height: 24px;
      min-width: 42px;
      border-radius: 20px;
      background: rgba(255,255,255,.12);
      padding: 0;
    }

    .sidebar-toggle::after, .theme-toggle::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s ease;
    }

    .sidebar-toggle[aria-pressed="true"]::after,
    .theme-toggle[aria-pressed="true"]::after {
      transform: translateX(18px);
    }

    .search-container {
      padding: 18px;
      border-bottom: 1px solid var(--glass-border);
      position: relative;
    }

    .workspace-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .workspace-tools select,
    .workspace-tools button {
      width: auto;
      min-width: 0;
      height: 30px;
      padding: 0 9px;
      border-radius: 9px;
      color: var(--text-main);
      background: var(--btn-bg);
      border: 1px solid var(--glass-border);
      font-size: 11px;
      box-shadow: none;
    }

    .workspace-tools button.active {
      background: #fff;
      color: #000;
    }

    .sidebar-scroll-area {
      overflow-y: auto;
      flex-grow: 1;
      padding: 10px;
    }

    .folder-group {
      margin-left: 15px;
      border-left: 1px solid var(--glass-border);
      padding-left: 5px;
      display: none;
    }

    .folder-group.open {
      display: block;
    }

    .item-row {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      transition: background .2s ease, color .2s ease, transform .2s ease;
      content-visibility: auto;
      contain-intrinsic-size: 38px;
      font-size: 12px;
      margin: 2px 0;
    }

    #tree-container.grid-view,
    #search-results.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .grid-view .item-row {
      min-height: 110px;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .grid-view ul {
      display: contents;
    }

    .grid-view .icon {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .file-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      margin: 0 8px 0 0;
    }

    .grid-view .file-thumb {
      width: 56px;
      height: 56px;
      margin: 0 0 8px;
    }

    .item-row.favorite::after {
      content: '★';
      color: #facc15;
      margin-left: auto;
    }

    .grid-view .item-row.favorite::after {
      margin: 6px 0 0;
    }

    .item-row:hover {
      background: var(--btn-bg);
      color: var(--text-main);
    }

    .item-row.active {
      background: #fff;
      color: #000;
    }

    .arrow {
      display: inline-block;
      width: 12px;
      margin-right: 6px;
      font-size: 10px;
      transition: transform .2s ease;
    }

    .folder-row.open > .arrow {
      transform: rotate(90deg);
    }

    .icon {
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
    }

    .watermark {
      padding: 15px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: center;
    }

    .watermark img {
      width: 220px;
    }

    .dropzone {
      padding: 18px;
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 14px;
      text-align: center;
      color: var(--text-muted);
      transition: background .2s ease, border-color .2s ease;
    }

    .dropzone.dragover {
      background: rgba(96,165,250,.16);
      border-color: #60a5fa;
      color: #fff;
    }

    .upload-progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }

    .upload-progress-item {
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-track {
      height: 5px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255,255,255,.1);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #60a5fa;
      transition: width .15s ease;
    }

    #toast-container {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      min-width: 220px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      background: rgba(25,25,30,.9);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      animation: toast-in .25s ease both;
      pointer-events: auto;
      font-size: 12px;
    }

    .toast.error { border-color: #f87171; }
    .toast.success { border-color: #4ade80; }

    #debug-panel {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 3000;
      display: none;
      width: min(420px, calc(100vw - 40px));
      max-height: 220px;
      overflow: auto;
      padding: 14px;
      border-radius: 14px;
      color: #cbd5e1;
      background: rgba(8,10,15,.94);
      border: 1px solid var(--glass-border);
      font: 11px/1.5 monospace;
      white-space: pre-wrap;
    }

    #debug-panel.open { display: block; }

    #context-menu {
      position: fixed;
      z-index: 3500;
      display: none;
      min-width: 170px;
      padding: 6px;
      border-radius: 12px;
    }

    #context-menu.open { display: block; }

    .context-action {
      display: block;
      width: 100%;
      height: 32px;
      min-width: 0;
      padding: 0 10px;
      border: 0;
      background: none;
      color: var(--text-main);
      border-radius: 7px;
      text-align: left;
      box-shadow: none;
    }

    .context-action:hover {
      background: var(--btn-bg);
    }

    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* =========================
       MAIN & TAB BAR
       ========================= */
    main {
      position: absolute;
      top: 84px;
      bottom: 12px;
      left: 12px;
      right: 12px;
      overflow: hidden;
      border-radius: var(--radius-large);
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .tab-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(10, 10, 14, 0.85);
      border-bottom: 1px solid var(--glass-border);
      padding: 6px 10px 0;
      overflow-x: auto;
      height: 38px;
      flex-shrink: 0;
      z-index: 10;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-bottom: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      max-width: 180px;
      white-space: nowrap;
      user-select: none;
      transition: all 0.15s ease;
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .tab-item.active {
      background: rgba(30, 30, 38, 0.95);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      font-weight: 500;
    }

    .tab-item .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-item .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .tab-item .tab-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.2);
    }

    #iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      transform-origin: top center;
      transition: transform .2s;
    }

    #file-viewer {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      z-index: 5;
    }

    /* =========================
       OVERLAY & MODALS
       ========================= */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 998;
    }

    #overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    #upload-modal,
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 2000;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      background: rgba(0,0,0,.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-overlay.active { display: flex; }
    #upload-modal { z-index: 2000; }
    #admin-login-modal, #admin-dash-modal { z-index: 5000; }
    #admin-pad-modal { z-index: 5001; }
    #admin-confirm-modal, #shortcuts-modal { z-index: 5002; }

    .admin-modal-card {
      width: min(720px, 100%);
      max-height: min(88dvh, 820px);
      overflow-y: auto;
      padding: 22px;
      border-radius: 20px;
      background: rgba(20,20,24,.98);
      border: 1px solid var(--glass-border);
      box-shadow: 0 24px 80px rgba(0,0,0,.72);
    }

    .admin-modal-card.narrow { width: min(420px, 100%); }
    .admin-modal-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .admin-modal-heading h2 { font-size: 18px; }
    .admin-modal-copy { margin-top: 8px; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
    .admin-field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
    .admin-field[hidden] { display: none; }
    .admin-field label { font-size: 12px; color: var(--text-muted); }
    .admin-field input, .admin-field textarea, .admin-field select {
      width: 100%;
      min-height: 40px;
      padding: 10px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: rgba(0,0,0,.3);
      color: var(--text-main);
      font: inherit;
    }

    .admin-field input[type="checkbox"] { width: auto; min-height: auto; padding: 0; }
    #admin-pad-lock-field label { display: flex; align-items: center; gap: 8px; }
    .admin-field textarea { min-height: 120px; resize: vertical; }
    .admin-form-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .admin-status { min-height: 18px; margin-top: 10px; color: #fca5a5; font-size: 12px; }

    #admin-pads-table-container {
      margin-top: 14px;
      overflow-x: auto;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      border: 1px solid var(--glass-border);
    }

    #admin-dash-modal > .modal-box { width: min(1080px, 100%); max-width: 1080px !important; }
    .admin-files-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
    .admin-files-search { flex: 1 1 260px; max-width: 440px; min-height: 40px; padding: 9px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: #111; color: #fff; font: inherit; }
    .admin-files-count { color: #d4d4dc; font-size: 12px; }

    #admin-files-table-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: min(58dvh, 620px);
      overflow: auto;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: #111116;
    }

    .admin-file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #1d1d24;
      color: #f5f5f7;
    }

    .admin-file-info { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
    .admin-file-icon { flex: 0 0 26px; width: 26px; text-align: center; font-size: 20px; line-height: 1.3; }
    .admin-file-name { display: block; color: #fff; font-size: 14px; font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; white-space: normal; }
    .admin-file-path { display: block; margin-top: 3px; color: #c5c5d0; font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .admin-file-kind { display: inline-flex; margin-top: 6px; padding: 2px 7px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; color: #d8d8e0; font-size: 10px; }
    .admin-file-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .admin-file-actions button { height: 32px; width: auto; min-width: 0; padding: 0 10px; font-size: 11px; }
    .admin-files-empty { padding: 22px 14px; color: #e0e0e6; text-align: center; font-size: 13px; }

    #initial-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 6000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #08080b;
      background-image: radial-gradient(circle at 50% 35%, rgba(70,50,120,.22), transparent 55%);
    }

    #initial-loading-screen.active { display: flex; }

    .init
