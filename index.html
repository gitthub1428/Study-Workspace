<meta charset="UTF-8">

<title>Drive Workspace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">

<style>

:root{
    --bg-base:#050505;
    --glass-bg:rgba(20,20,24,.65);
    --glass-border:rgba(255,255,255,.08);
    --glass-shadow:0 8px 32px rgba(0,0,0,.5);

    --text-main:#e2e2e6;
    --text-muted:#8b8b98;

    --btn-bg:rgba(255,255,255,.10);
    --btn-hover:rgba(255,255,255,.18);

    --accent-active:#fff;
    --accent-text:#000;

    --radius-large:24px;
    --radius-pill:50px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;

    background:#050505;

    background-image:
    radial-gradient(circle at 15% 50%, rgba(70,50,120,.15), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(50,90,120,.15), transparent 40%);

    color:var(--text-main);

    overflow:hidden;

    height:100dvh;
}

body.white-theme{
    --glass-bg:rgba(255,255,255,.78);
    --glass-border:rgba(15,23,42,.14);
    --glass-shadow:0 8px 32px rgba(15,23,42,.16);
    --text-main:#172033;
    --text-muted:#526075;
    --btn-bg:rgba(15,23,42,.08);
    --btn-hover:rgba(15,23,42,.14);
    background:#eef2f7;
    color:var(--text-main);
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:var(--btn-hover);
    border-radius:10px;
}

.glass-panel{
    background:var(--glass-bg);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid var(--glass-border);

    box-shadow:var(--glass-shadow);
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;

    top:12px;
    left:12px;
    right:12px;

    height:58px;

    border-radius:var(--radius-pill);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    z-index:1000;

    overflow:hidden;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;

    gap:6px;

    min-width:0;
}

.header-right{
    margin-left:auto;
}

.sync-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#4ade80;

    box-shadow:0 0 10px #4ade80;

    opacity:0;

    flex-shrink:0;
}

.sync-dot.active{
    opacity:1;
}

button{
    flex-shrink:0;

    min-width:40px;
    width:40px;
    height:40px;

    padding:0;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.12);

    border-radius:var(--radius-pill);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.25s ease;

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 4px 12px rgba(0,0,0,.35);
}

button:hover{
    background:rgba(255,255,255,.24);

    border-color:rgba(255,255,255,.2);

    box-shadow:
    0 0 18px rgba(255,255,255,.08),
    0 6px 16px rgba(0,0,0,.4);
}

button:focus-visible,
.item-row:focus-visible,
.modal-folder:focus-visible,
#upload-dropzone:focus-visible{
    outline:2px solid #60a5fa;
    outline-offset:2px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

button svg{
    width:18px;
    height:18px;
}

#upload-btn{
    background:rgba(255, 255, 255, 0.28);
}

#download-btn{
    background:rgba(255, 255, 255, 0.28);

    display:none;
}

#refresh-btn.loading svg{
    animation:spin 1s linear infinite;
}

.zoom-controls{
    display:flex;
    align-items:center;

    background:var(--btn-bg);

    border-radius:var(--radius-pill);

    padding:2px;

    flex-shrink:1;
}

.zoom-controls button{
    min-width:34px;
    width:34px;
    height:34px;

    background:none;
}

#zoom-display{
    min-width:38px;

    text-align:center;

    font-size:11px;

    color:var(--text-muted);
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
    position:fixed;

    top:84px;
    left:-320px;

    width:280px;

    height:calc(100dvh - 96px);

    border-radius:var(--radius-large);

    overflow:hidden;

    display:flex;
    flex-direction:column;

    transition:left .35s;

    z-index:999;
}

#sidebar.open{
    left:12px;
}

#sidebar.closed{
    left:-320px;
}

body.sidebar-closed main{
    left:12px;
}

.sidebar-toggle{
    position:relative;
    width:42px;
    height:24px;
    min-width:42px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

.sidebar-toggle::after{
    content:'';
    position:absolute;
    top:4px;
    left:4px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#fff;
    transition:transform .2s ease;
}

.sidebar-toggle[aria-pressed="true"]::after{
    transform:translateX(18px);
}

.theme-toggle{
    position:relative;
    width:42px;
    height:24px;
    min-width:42px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
}

.theme-toggle::after{
    content:'☾';
    position:absolute;
    top:3px;
    left:4px;
    width:18px;
    height:18px;
    line-height:18px;
    border-radius:50%;
    color:#000;
    background:#fff;
    font-size:12px;
    transition:transform .2s ease;
}

.theme-toggle[aria-pressed="true"]::after{
    content:'☀';
    transform:translateX(18px);
}

.search-container{
    padding:18px;
    border-bottom:1px solid var(--glass-border);
    position:relative;
}

.workspace-tools{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.workspace-tools select,
.workspace-tools button{
    width:auto;
    min-width:0;
    height:30px;
    padding:0 9px;
    border-radius:9px;
    color:var(--text-main);
    background:var(--btn-bg);
    border:1px solid var(--glass-border);
    font-size:11px;
}

.workspace-tools button.active{background:#fff;color:#000}

.search-history{
    display:none;
    position:absolute;
    left:18px;
    right:18px;
    top:68px;
    z-index:4;
    padding:6px;
    border-radius:10px;
}

.search-history.open{display:block}
.history-item{padding:8px;border-radius:7px;cursor:pointer;color:var(--text-muted);font-size:11px}
.history-item:hover{background:var(--btn-bg);color:var(--text-main)}

#search-bar{
    width:100%;

    padding:12px 18px;

    border-radius:var(--radius-pill);

    border:1px solid var(--glass-border);

    background:var(--btn-bg);

    color:var(--text-main);

    outline:none;
}

.sidebar-scroll-area{
    overflow-y:auto;
    flex-grow:1;

    padding:10px;
}

.folder-group{
    margin-left:15px;

    border-left:1px solid var(--glass-border);

    padding-left:5px;

    display:none;
}

.folder-group.open{
    display:block;
}

.item-row{
    display:flex;
    align-items:center;

    padding:10px 12px;

    border-radius:10px;

    cursor:pointer;

    color:var(--text-muted);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    user-select:none;

    transition:background .2s ease,color .2s ease,transform .2s ease;
    content-visibility:auto;
    contain-intrinsic-size:38px;
}

#tree-container.grid-view,
#search-results.grid-view,
#recent-files.grid-view{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px;
}

.grid-view .item-row{
    min-height:110px;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    white-space:normal;
    overflow-wrap:anywhere;
}

.grid-view ul{
    display:contents;
}

.grid-view .icon{
    margin:0 0 8px;
    font-size:24px;
}

.file-thumb{
    width:44px;
    height:44px;
    object-fit:cover;
    border-radius:8px;
    margin:0 8px 0 0;
}

.grid-view .file-thumb{
    width:56px;
    height:56px;
    margin:0 0 8px;
}

.item-row.favorite::after{content:'★';color:#facc15;margin-left:auto}
.grid-view .item-row.favorite::after{margin:6px 0 0}

.item-row:hover{
    background:var(--btn-bg);

    color:var(--text-main);
}

.item-row.active{
    background:#fff;

    color:#000;
}

.arrow{
    width:12px;

    margin-right:6px;

    font-size:10px;
}

.folder-row.open .arrow{
    transform:rotate(90deg);
}

.icon{
    margin-right:8px;
}

.watermark{
    padding:15px;

    border-top:1px solid var(--glass-border);

    display:flex;
    justify-content:center;
}

.watermark img{
    width:220px;

}

.recent-heading{
    padding:12px 12px 6px;
    color:var(--text-muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

#recent-files:empty + .recent-heading{
    display:none;
}

.skeleton-row{
    height:38px;
    margin:4px 0;
    border-radius:10px;
    background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.16),rgba(255,255,255,.05));
    background-size:200% 100%;
    animation:shimmer 1.2s ease-in-out infinite;
}

.dropzone{
    padding:18px;
    border:1px dashed rgba(255,255,255,.25);
    border-radius:14px;
    text-align:center;
    color:var(--text-muted);
    transition:background .2s ease,border-color .2s ease;
}

.dropzone.dragover{
    background:rgba(96,165,250,.16);
    border-color:#60a5fa;
    color:#fff;
}

.upload-progress-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:150px;
    overflow-y:auto;
}

.upload-progress-item{
    font-size:11px;
    color:var(--text-muted);
}

.progress-track{
    height:5px;
    margin-top:5px;
    overflow:hidden;
    border-radius:5px;
    background:rgba(255,255,255,.1);
}

.progress-bar{
    width:0;
    height:100%;
    background:#60a5fa;
    transition:width .15s ease;
}

#toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:3000;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
}

.toast{
    min-width:220px;
    max-width:360px;
    padding:12px 14px;
    border-radius:12px;
    color:#fff;
    background:rgba(25,25,30,.9);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
    animation:toast-in .25s ease both;
    pointer-events:auto;
    font-size:12px;
}

.toast.error{border-color:#f87171}
.toast.success{border-color:#4ade80}

#debug-panel{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:3000;
    display:none;
    width:min(420px,calc(100vw - 40px));
    max-height:220px;
    overflow:auto;
    padding:14px;
    border-radius:14px;
    color:#cbd5e1;
    background:rgba(8,10,15,.94);
    border:1px solid var(--glass-border);
    font:11px/1.5 monospace;
    white-space:pre-wrap;
}

#debug-panel.open{display:block}

#context-menu{
    position:fixed;
    z-index:3500;
    display:none;
    min-width:170px;
    padding:6px;
    border-radius:12px;
}

#context-menu.open{display:block}
.context-action{display:block;width:100%;height:32px;min-width:0;padding:0 10px;border:0;background:none;color:var(--text-main);border-radius:7px;text-align:left;box-shadow:none}
.context-action:hover{background:var(--btn-bg)}

#file-info-panel{
    position:absolute;
    top:12px;
    right:12px;
    z-index:8;
    display:none;
    width:min(280px,calc(100% - 24px));
    padding:16px;
    border-radius:14px;
    font-size:12px;
}

#file-info-panel.open{display:block}
.info-title{font-weight:600;margin-bottom:10px;overflow-wrap:anywhere}
.info-line{color:var(--text-muted);margin:6px 0}

@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =========================
   MAIN
========================= */

main{
    position:absolute;

    top:84px;
    bottom:12px;
    left:12px;
    right:12px;

    overflow:hidden;

    border-radius:var(--radius-large);

    background:#000;
}

#iframe-wrapper{
    width:100%;
    height:100%;

    transform-origin:top center;

    transition:transform .2s;
}

#file-viewer{
    width:100%;
    height:100%;

    border:none;

    display:none;

    background:#fff;
}

#placeholder{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:var(--text-muted);

    z-index:5;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    opacity:0;
    pointer-events:none;

    transition:.3s;

    z-index:998;
}

#overlay.active{
    opacity:1;
    pointer-events:all;
}

/* =========================
   MODALS
========================= */

#upload-modal,
#loading-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(4px);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transition:.3s;

    z-index:2000;
}

#upload-modal.active,
#loading-overlay.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    width:90%;
    max-width:450px;

    border-radius:var(--radius-large);

    padding:25px;

    display:flex;
    flex-direction:column;

    gap:15px;
}

.modal-folder-list{
    height:220px;

    overflow-y:auto;

    border:1px solid var(--glass-border);

    border-radius:10px;

    padding:10px;
}

.modal-folder{
    padding:10px;

    border-radius:8px;

    cursor:pointer;
}

.modal-folder:hover{
    background:var(--btn-bg);
}

.modal-actions{
    display:flex;

    gap:10px;
}

.modal-actions input{
    flex-grow:1;

    padding:10px;

    border-radius:10px;

    border:1px solid var(--glass-border);

    background:var(--btn-bg);

    color:var(--text-main);
}

.breadcrumb{
    font-size:12px;

    color:var(--text-muted);

    display:flex;
    flex-wrap:wrap;

    gap:5px;
}

.breadcrumb span{
    color:#60a5fa;

    cursor:pointer;
}

.btn-primary{
    background:#fff;

    color:#000;
}

/* =========================
   LOADING
========================= */

.spinner{
    width:50px;
    height:50px;

    border:5px solid rgba(255,255,255,.1);
    border-top-color:#fff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.viewer-loading #placeholder{
    display:flex;
}

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   DESKTOP
========================= */

@media(min-width:768px){

    #sidebar{
        left:12px;
    }

    main{
        left:304px;
    }

    #overlay.active{
        opacity:0;
        pointer-events:none;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    header{
        padding:0 6px;
    }

    .header-left,
    .header-right{
        gap:4px;
    }

    button{
        min-width:36px;
        width:36px;
        height:36px;
    }

    button svg{
        width:16px;
        height:16px;
    }

    .zoom-controls{
        padding:1px;
    }

    .zoom-controls button{
        width:30px;
        height:30px;
        min-width:30px;
    }

    #zoom-display{
        min-width:32px;
        font-size:10px;
    }
}


/* File editing and activity tools */
#workspace-extra-tools{position:fixed;right:24px;bottom:24px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
#workspace-extra-tools button{width:auto;min-width:0;padding:0 13px;height:36px;border-radius:12px;color:var(--text-main);background:var(--glass-bg);border:1px solid var(--glass-border);font-size:12px}
#editor-modal{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:16px}
#editor-modal.open{display:flex}
#editor-box{width:min(1000px,96vw);height:min(780px,92dvh);display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px}
#editor-box h2{font-size:16px}
#editor-status{font-size:12px;color:var(--text-muted);min-height:16px}
#editor-text{flex:1;width:100%;min-height:180px;resize:none;border:1px solid var(--glass-border);border-radius:12px;padding:14px;background:rgba(10,10,14,.7);color:var(--text-main);font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}
#editor-actions{display:flex;gap:8px;flex-wrap:wrap}
#editor-actions button{width:auto;min-width:0;padding:0 13px;border-radius:10px}
#activity-modal{position:fixed;inset:0;z-index:4001;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:16px}
#activity-modal.open{display:flex}
#activity-box{width:min(700px,96vw);max-height:85dvh;overflow:auto;padding:18px;border-radius:18px}
#activity-list{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:var(--text-muted)}
@media(max-width:767px){#workspace-extra-tools{right:18px;bottom:18px}#editor-box{height:94dvh;padding:12px}}

</style>
</head>

<body>

<div id="loading-overlay">
    <div class="spinner" role="status" aria-label="Uploading"></div>
</div>

<div id="upload-modal" role="dialog" aria-modal="true" aria-label="Upload file">

    <div class="modal-box glass-panel">

        <div class="breadcrumb" id="modal-breadcrumb"></div>

        <div class="modal-folder-list" id="modal-folder-list"></div>

        <div class="dropzone" id="upload-dropzone" tabindex="0">
            Drop files here or choose files below
        </div>

        <div class="upload-progress-list" id="upload-progress-list"></div>

        <div class="modal-actions">
            <input type="text" id="new-folder-name" placeholder="New folder name" maxlength="120">
            <button id="create-folder-btn" type="button" aria-label="Create folder" title="Create folder">Create</button>
        </div>

        <div class="modal-actions">

            <button id="cancel-upload-btn" type="button" title="Cancel upload">
                Cancel
            </button>

            <button id="confirm-upload-btn" type="button" aria-label="Choose file" title="Choose file" class="btn-primary">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>

                </svg>

            </button>

                 <button id="choose-folder-btn" type="button" aria-label="Choose folder" title="Choose folder">Folder</button>

            <input type="file" id="file-input" accept="*/*" multiple="" style="display:none;">

                 <input type="file" id="folder-input" webkitdirectory="" directory="" multiple="" style="display:none;">

        </div>

    </div>

</div>

<header class="glass-panel">

    <div class="header-left">

        <button id="sidebar-toggle-btn" class="sidebar-toggle" type="button" aria-label="Toggle file list" aria-pressed="false" title="Close file list"></button>

        <button id="theme-toggle-btn" class="theme-toggle" type="button" aria-label="Switch to white theme" aria-pressed="false" title="Switch to white theme"></button>

        <div class="sync-dot" id="sync-indicator"></div>

    </div>

    <div class="header-right">

        <div class="zoom-controls">

            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">-</button>

            <span id="zoom-display">
                100%
            </span>

            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>

        </div>

        <button id="refresh-btn"
